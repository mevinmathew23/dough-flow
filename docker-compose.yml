services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doughflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doughflow_dev}
      POSTGRES_DB: ${POSTGRES_DB:-doughflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doughflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: ./dough_flow_api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-doughflow}:${POSTGRES_PASSWORD:-doughflow_dev}@postgres:5432/${POSTGRES_DB:-doughflow}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dough_flow_api/api:/app/api
    deploy:
      resources:
        limits:
          memory: 256M

  frontend:
    build:
      context: ./dough_flow_ui
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 128M

  # Local LLM inference via Ollama (OpenAI-compatible at http://ollama:11434/v1)
  # Enable with: LLM_ENABLED=true in .env
  # For NVIDIA GPU support, add: runtime: nvidia + NVIDIA_VISIBLE_DEVICES: all
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4096M

  # Pulls the configured model on first startup, then exits.
  # Re-run manually if you change LLM_MODEL: docker compose run --rm ollama-init
  ollama-init:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-qwen3.5:0.8b}"]
    restart: "no"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  pgdata:
  ollama_data:
